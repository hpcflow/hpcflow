on:
  push:
    branches:
      - main
  workflow_dispatch:
    # Allow manual triggering
jobs:
  update-contrib-table:
    runs-on: ubuntu-latest
    name: Update the table of contributors in the README
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Update contributor table
        uses: akhilmhdh/contributors-readme-action@83ea0b4f1ac928fbfe88b9e8460a932a528eb79f
        with:
          commit_message: update-contrib-table has updated README.md [skip ci]
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
