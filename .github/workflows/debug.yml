name: debug
env:
  POETRY_VERSION: "2.1.3"
on:
  workflow_dispatch:
    inputs:
      integration_test_args:
        description: "CLI args to pass verbatim to pytest (integration tests)."
        required: false
        type: string
        default: ""
jobs:
  test-integration:
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"

    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}

      - name: Setup tmate session
        uses: mxschmitt/action-tmate@v3
        with:
          detached: true

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install and configure poetry
        run: |
          python -m pip install poetry==${{ env.POETRY_VERSION }}
          poetry config virtualenvs.in-project true

      - name: Cache the virtualenv
        uses: actions/cache@v5
        with:
          path: ./.venv
          key: ${{ runner.os }}-test-${{ matrix.python-version }}-venv-${{ hashFiles('**/poetry.lock') }}

      - name: Install dependencies
        run: |
          poetry install --without dev,pyinstaller

      - name: Run tests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          poetry run hpcflow config set log_file_level debug
          poetry run hpcflow test  --integration ${{ github.event.inputs.integration_test_args }}
