name: Documentation prototype

on:
  pull_request:
    paths:
      - 'docs-next/**'
      - '.github/workflows/docs-next.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: docs-next/requirements.txt
      - name: Install documentation dependencies
        run: python -m pip install -r docs-next/requirements.txt
      - name: Build all prototype sites
        run: python docs-next/build.py
      - name: Upload downloadable preview
        uses: actions/upload-artifact@v7
        with:
          name: documentation-prototype
          path: docs-next/_build/
          if-no-files-found: error
          retention-days: 1
