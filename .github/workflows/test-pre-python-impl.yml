name: test-pre-python Implementation

on:
  workflow_call:
    inputs:
      ref:
        description: Git commit reference.
        required: true
        type: string
      head-ref:
        description: Git HEAD commit reference (branch name).
        required: false
        type: string
        default: ""
      pytest-args:
        description: Raw arguments to pass to pytest.
        required: true
        type: string

# Don't run simultaneously on the same branch (since we may commit to that branch)
concurrency: ci-${{ inputs.head-ref && format('refs/heads/{0}', inputs.head-ref) || inputs.ref }}

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.13-dev"
        os:
          - ubuntu-latest
          - macos-13
          - windows-latest

    env:
      POETRY_VERSION: "1.4"

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
      - uses: ./.github/actions/init-cache
        with:
          name: test
          version: ${{ matrix.python-version }}

      - name: Install and configure poetry
        run: |
          python -m pip install poetry==${{ env.POETRY_VERSION }}
          poetry config virtualenvs.in-project true
          poetry config installer.modern-installation false

      - name: Install dependencies
        run: |
          poetry install --without dev,pyinstaller

      - name: Run tests
        run: |
          poetry run python -m pytest ${{ inputs.pytest-args }}
