name: benchmark

env:
  POETRY_VERSION: "1.4"

on:
  workflow_dispatch: # manual invocation
    inputs:
      python:
        description: "Which Pythons to use."
        default: '["3.12"]'
      num_elements:
        description: "How many elements to make in the workflow."
        default: '[1, 10, 100, 1000, 10000]'
      platform:
        description: "Which OS to use."
        default: '["ubuntu-latest", "macos-13", "windows-latest"]'

jobs:
  make-workflow-benchmark:
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(github.event.inputs.python)}}
        os: ${{ fromJSON(github.event.inputs.platform)}}
        num_elements: ${{ fromJSON(github.event.inputs.num_elements)}}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: ./.github/actions/setup-poetry
        with:
          version: ${{ env.POETRY_VERSION }}
      - uses: ./.github/actions/init-cache
        with:
          name: benchmark
          version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          poetry install --without dev,pyinstaller

      - name: Set up variables
        id: vars
        run: |
          echo "timeit=benchmark_make_workflow_${{ matrix.num_elements }}_elements-${{ runner.os }}-py-${{ matrix.python-version }}.txt" >> $GITHUB_OUTPUT

      - name: Run app make workflow command
        run: |
          poetry run hpcflow --timeit-file $TIMEIT_FILE make ./hpcflow/tests/data/benchmark_N_elements.yaml --var N $N_ELEMS
        env:
          TIMEIT_FILE: ${{ steps.vars.outputs.timeit }}
          N_ELEMS: ${{ matrix.num_elements }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.vars.outputs.timeit }}
          path: ${{ steps.vars.outputs.timeit }}

  make-workflow-benchmark-upload:
    needs: make-workflow-benchmark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - run: |
          mkdir benchmarks
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: benchmarks
      - uses: actions/upload-artifact@v4
        with:
          name: benchmarks
          path: benchmarks
