name: Bump downstream project version
concurrency: bump-downstream

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["release"]
    types:
      - completed

env:
  PYTHON_VERSION_MAKE_PRs: "3.13"
  POETRY_VERSION: "2.1.3"

jobs:
  create-matflow-pull-request:
    if: ( github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' )
    runs-on: ubuntu-latest
    steps:
      - name: Checkout MatFlow develop branch
        uses: actions/checkout@v7
        with:
          repository: hpcflow/matflow
          fetch-depth: 0 # get all history and tags
          token: ${{ secrets.HPCFLOW_ACTIONS_TOKEN }}
          ref: develop

      - name: Configure git
        uses: hpcflow/github-support/configure-git@main

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION_MAKE_PRs }}

      - name: Setup poetry
        uses: hpcflow/github-support/setup-poetry@main
        with:
          version: ${{ env.POETRY_VERSION }}

      - name: Install dependencies
        run: |
          poetry install

      - name: Checkout branch
        # (Re)create the bump branch from develop, so an existing branch is updated
        # without merge conflicts in `poetry.lock`:
        run: git switch -C bump/hpcflow develop

      - name: Get version number
        id: get_version
        run: |
          HPCFLOW_VERSION=$(poetry add hpcflow@latest --dry-run --allow-prereleases | head -n 1 | sed -E 's/.*\^([0-9a-z.]+).*/\1/')
          echo "HPCFLOW_VERSION=${HPCFLOW_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Update hpcflow
        env:
          HPCFLOW_VERSION: ${{ steps.get_version.outputs.HPCFLOW_VERSION }}
        run: poetry add hpcflow@${HPCFLOW_VERSION}

      - name: Commit changes
        id: commit
        env:
          HPCFLOW_VERSION: ${{ steps.get_version.outputs.HPCFLOW_VERSION }}
        run: |
          git add pyproject.toml poetry.lock
          if git diff --cached --quiet; then
            echo "MatFlow develop already uses hpcflow ${HPCFLOW_VERSION}; nothing to do."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "feat: bump hpcflow version to ${HPCFLOW_VERSION}"
          git push --force --set-upstream origin bump/hpcflow
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Create or update pull request
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.HPCFLOW_ACTIONS_TOKEN }}
          HPCFLOW_VERSION: ${{ steps.get_version.outputs.HPCFLOW_VERSION }}
        run: |
          TITLE="Bump hpcflow version to ${HPCFLOW_VERSION}"
          BODY="Created by GitHub action"
          PR_NUMBER=$(gh pr list --repo hpcflow/matflow --base develop --head bump/hpcflow --state open --json number --jq '.[0].number // empty')
          if [ -n "${PR_NUMBER}" ]; then
            gh pr edit "${PR_NUMBER}" --repo hpcflow/matflow --title "${TITLE}" --body "${BODY}"
          else
            gh pr create --repo hpcflow/matflow --base develop --head bump/hpcflow --title "${TITLE}" --body "${BODY}"
          fi
