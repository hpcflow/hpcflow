{% extends "!page.html" %}
{% block announcement %}
<nav class="section-nav" aria-label="Main sections">
  <a class="project-home" href="{{ pathto('index') }}">{{ project }}</a>
  {% for target, label in sections %}
  <a href="{{ pathto(target) }}"{% if active_section and active_section[0] == target %} aria-current="{{ 'page' if pagename == target else 'true' }}"{% endif %}>{{ label }}</a>
  {% endfor %}
  <span class="preview-label">Preview</span>
</nav>
{% endblock %}
